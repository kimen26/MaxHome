<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxBudget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MaxBudget</h1>
  <nav id="nav" hidden>
    <button id="prev" title="Mois précédent">‹</button>
    <span id="titre-mois"></span>
    <button id="next" title="Mois suivant">›</button>
    <button id="ouvrir-charges" class="lien">Charges</button>
    <button id="ouvrir-comptes" class="lien">Comptes</button>
    <button id="logout">Déconnexion</button>
  </nav>
</header>

<main>
  <section id="login">
    <form id="form-login">
      <label>Email <input type="email" name="email" required autocomplete="username"></label>
      <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit">Se connecter</button>
      <p id="login-erreur" class="erreur"></p>
    </form>
  </section>

  <section id="app" hidden>
    <p id="proposition-copie" class="bandeau" hidden>
      <span id="proposition-texte"></span>
      <button id="btn-copier-depuis-precedent">Démarrer depuis ce mois</button>
    </p>

    <section id="a-faire" class="bloc-a-faire"></section>

    <h2>Revenus</h2>
    <table id="revenus"><tbody></tbody></table>

    <h2>Charges</h2>
    <div id="categories"></div>
    <p class="total-ligne">
      Total commun : <strong id="total"></strong>
      — dont égales <span id="total-egales"></span>,
      prorata <span id="total-proport"></span>,
      clé <span id="total-cle"></span>
    </p>

    <h2>Ponctuels</h2>
    <div id="ponctuels"></div>
    <button id="btn-ajouter-ponctuel" class="lien">+ ponctuel</button>

    <h2>Ajustements</h2>
    <div id="ajustements"></div>
    <button id="btn-ajouter-ajustement" class="lien">+ ajustement</button>

    <p id="statut" class="statut"></p>
  </section>

  <section id="panneau-charges" class="panneau" hidden>
    <div class="panneau-tete"><h2>Gestion des charges</h2><button class="fermer" data-cible="panneau-charges">×</button></div>
    <table id="liste-charges"><tbody></tbody></table>
    <form id="form-charge" class="inline">
      <input name="libelle" placeholder="Nouvelle dépense" required>
      <select name="categorie">
        <option>Logement</option><option>Max</option><option>Épargne</option>
        <option>Alimentation</option><option>Impôts</option><option>Banque</option><option selected>Autre</option>
      </select>
      <select name="regle">
        <option value="egales">Égales</option><option value="proport">Prorata</option>
        <option value="cle">Clé %</option><option value="perso">Perso</option>
      </select>
      <button type="submit">Ajouter</button>
    </form>
  </section>

  <section id="panneau-comptes" class="panneau" hidden>
    <div class="panneau-tete"><h2>Comptes</h2><button class="fermer" data-cible="panneau-comptes">×</button></div>
    <table id="liste-comptes"><tbody></tbody></table>
    <form id="form-compte" class="inline">
      <input name="nom" placeholder="Nom (ex. Boursorama commun)" required>
      <input name="titulaire" placeholder="Titulaire">
      <input name="iban_masque" placeholder="4 derniers chiffres" maxlength="4">
      <input name="note" placeholder="Note (virement permanent…)">
      <label><input type="checkbox" name="commun"> commun</label>
      <button type="submit">Ajouter</button>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
